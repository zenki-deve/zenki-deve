name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Indepth Languages & GitHub Stats
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics-languages.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: zenki-deve
          template: classic
          base: header, repositories
          config_timezone: Europe/Kyiv
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_details: lines, percentage
          plugin_languages_limit: 8

      - name: PageSpeed Detailed Report (texttoimages.pro/ua)
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          filename: assets/metrics-pagespeed.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: zenki-deve
          template: classic
          base: ""
          config_timezone: Europe/Kyiv
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://texttoimages.pro/ua/
          plugin_pagespeed_detailed: yes
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}
